name: Build Hey Sheri APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify and Organize Android Project Structure
      run: |
        echo "=== Current Root Directory Contents ==="
        ls -la

        # 1. If files were placed inside a subfolder, move them to root
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          FOUND_SETTINGS=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -n "$FOUND_SETTINGS" ]; then
            SUBDIR=$(dirname "$FOUND_SETTINGS")
            echo "Found Android files inside subfolder: $SUBDIR"
            echo "Moving files from $SUBDIR to repository root..."
            cp -r "$SUBDIR"/* .
          fi
        fi

        echo "=== Root Directory After Structure Check ==="
        ls -la

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Fix & Validate Gradle Wrapper (Self-Healing)
      run: |
        mkdir -p gradle/wrapper

        # Ensure gradle-wrapper.properties is valid
        if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        fi

        # Ensure gradle-wrapper.jar exists and is not 0 bytes
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Downloading official Gradle 8.7 wrapper jar..."
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        fi

        # Ensure gradlew script exists and is executable
        if [ ! -f "./gradlew" ] || [ ! -s "./gradlew" ]; then
          echo "Downloading official gradlew runner script..."
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
        fi
        chmod +x ./gradlew

        echo "=== Verified Gradle Wrapper ==="
        ls -la gradlew gradle/wrapper/

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.7"
        cache-read-only: false

    - name: Build Android Debug APK (Clean & Fresh)
      run: |
        # Run clean build to avoid any stale cache issues
        ./gradlew clean assembleDebug --no-daemon --stacktrace

    - name: Upload Hey Sheri Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: HeySheri-Debug-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 14
