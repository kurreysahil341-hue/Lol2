name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
        validate-wrappers: false

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps --no-audit --no-fund

    - name: Automatically Update Android SDK & Gradle Plugin Versions
      env:
        AI_ASSISTANT_API_KEY: ${{ secrets.AI_ASSISTANT_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        CALLING_API_KEY: ${{ secrets.CALLING_API_KEY }}
        CAMERA_API_KEY: ${{ secrets.CAMERA_API_KEY }}
      run: |
        python3 -c "
        import re
        import os
        
        # Bake API Keys into src/config/api-config.ts if provided in GitHub Secrets
        config_path = 'src/config/api-config.ts'
        if os.path.exists(config_path):
            with open(config_path, 'r') as f:
                content = f.read()
            
            gemini_key = os.environ.get('AI_ASSISTANT_API_KEY') or os.environ.get('GEMINI_API_KEY') or os.environ.get('VITE_GEMINI_API_KEY')
            if gemini_key:
                content = content.replace('YOUR_GEMINI_API_KEY_HERE', gemini_key)
                print('Successfully baked Gemini API Key into api-config.ts!')
            
            youtube_key = os.environ.get('YOUTUBE_API_KEY')
            if youtube_key:
                content = content.replace('YOUR_YOUTUBE_API_KEY_HERE', youtube_key)
                print('Successfully baked YouTube API Key into api-config.ts!')
                
            maps_key = os.environ.get('GOOGLE_MAPS_API_KEY')
            if maps_key:
                content = content.replace('YOUR_GOOGLE_MAPS_API_KEY_HERE', maps_key)
                print('Successfully baked Google Maps API Key into api-config.ts!')
                
            calling_key = os.environ.get('CALLING_API_KEY')
            if calling_key:
                content = content.replace('YOUR_CALLING_API_KEY_HERE', calling_key)
                print('Successfully baked Calling API Key into api-config.ts!')
                
            camera_key = os.environ.get('CAMERA_API_KEY')
            if camera_key:
                content = content.replace('YOUR_CAMERA_API_KEY_HERE', camera_key)
                print('Successfully baked Camera API Key into api-config.ts!')
                
            with open(config_path, 'w') as f:
                f.write(content)

        # Update build.gradle
        with open('android/build.gradle', 'r') as f:
            content = f.read()
        content = re.sub(r'gradle:[0-9.]+', 'gradle:8.9.1', content)
        with open('android/build.gradle', 'w') as f:
            f.write(content)

        # Update variables.gradle
        with open('android/variables.gradle', 'r') as f:
            content = f.read()
        content = re.sub(r'compileSdkVersion = \d+', 'compileSdkVersion = 34', content)
        content = re.sub(r'targetSdkVersion = \d+', 'targetSdkVersion = 34', content)
        with open('android/variables.gradle', 'w') as f:
            f.write(content)

        # Update AndroidManifest.xml permissions
        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        with open(manifest_path, 'r') as f:
            manifest_content = f.read()
        permissions = [
            'android.permission.RECORD_AUDIO',
            'android.permission.MODIFY_AUDIO_SETTINGS',
            'android.permission.CAMERA',
            'android.permission.CALL_PHONE',
            'android.permission.FLASHLIGHT'
        ]
        needed_tags = ''
        for p in permissions:
            if p not in manifest_content:
                needed_tags += f'\n    <uses-permission android:name=\"{p}\" />'
        if needed_tags:
            manifest_content = manifest_content.replace('</manifest>', needed_tags + '\n</manifest>')
            with open(manifest_path, 'w') as f:
                f.write(manifest_content)
        "

    - name: Build Web Application
      run: npm run build

    - name: Install Capacitor CLI & Platforms
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        gradle assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-voice-assistant-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
