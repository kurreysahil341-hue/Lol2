name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
        validate-wrappers: false

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps --no-audit --no-fund

    - name: Build Web Application
      run: npm run build

    - name: Install Capacitor CLI & Platforms
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Automatically Update Android SDK & Gradle Plugin Versions
      run: |
        python3 -c "
        import re
        # Update build.gradle
        with open('android/build.gradle', 'r') as f:
            content = f.read()
        content = re.sub(r'gradle:[0-9.]+', 'gradle:8.9.1', content)
        with open('android/build.gradle', 'w') as f:
            f.write(content)

        # Update variables.gradle
        with open('android/variables.gradle', 'r') as f:
            content = f.read()
        content = re.sub(r'compileSdkVersion = \d+', 'compileSdkVersion = 36', content)
        content = re.sub(r'targetSdkVersion = \d+', 'targetSdkVersion = 36', content)
        with open('android/variables.gradle', 'w') as f:
            f.write(content)
        "

    - name: Build Android Debug APK
      run: |
        cd android
        gradle assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-voice-assistant-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
