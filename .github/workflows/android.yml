name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
        validate-wrappers: false

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps --no-audit --no-fund

    - name: Build Web Application
      run: npm run build

    - name: Install Capacitor CLI & Platforms
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Automatically Update Android SDK & Gradle Plugin Versions
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
      run: |${{ secrets.Ai_Assistant_API_KEY }}
        python3 -c "
        import re
        import os
        
        # Bake API Key into src/config/api-config.ts if provided in GitHub Secrets
        api_key = os.environ.get('GEMINI_API_KEY') or os.environ.get('VITE_GEMINI_API_KEY')
        if api_key:
            config_path = 'src/config/api-config.ts'
            with open(config_path, 'r') as f:
                content = f.read()
            content = content.replace('YOUR_GEMINI_API_KEY_HERE', api_key)
            with open(config_path, 'w') as f:
                f.write(content)
            print('Successfully baked API Key into api-config.ts!')

        # Update build.gradle
        with open('android/build.gradle', 'r') as f:
            content = f.read()
        content = re.sub(r'gradle:[0-9.]+', 'gradle:8.9.1', content)
        with open('android/build.gradle', 'w') as f:
            f.write(content)

        # Update variables.gradle
        with open('android/variables.gradle', 'r') as f:
            content = f.read()
        content = re.sub(r'compileSdkVersion = \d+', 'compileSdkVersion = 36', content)
        content = re.sub(r'targetSdkVersion = \d+', 'targetSdkVersion = 36', content)
        with open('android/variables.gradle', 'w') as f:
            f.write(content)

        # Update AndroidManifest.xml permissions
        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        with open(manifest_path, 'r') as f:
            manifest_content = f.read()
        if 'RECORD_AUDIO' not in manifest_content:
            permission_tags = '\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />'
            manifest_content = manifest_content.replace('</manifest>', permission_tags + '\n</manifest>')
            with open(manifest_path, 'w') as f:
                f.write(manifest_content)
        "

    - name: Build Android Debug APK
      run: |
        cd android
        gradle assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-voice-assistant-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
