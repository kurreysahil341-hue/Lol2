name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
        validate-wrappers: false

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cache Node Modules
      id: node-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-

    - name: Install Dependencies
      run: npm install --legacy-peer-deps --no-audit --no-fund --prefer-offline

    - name: Automatically Update Android SDK & Gradle Plugin Versions
      env:
        AI_ASSISTANT_API_KEY: ${{ secrets.AI_ASSISTANT_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: |
        python3 -c "
        import re
        import os
        
        # Bake API Keys into src/config/api-config.ts if provided in GitHub Secrets
        config_path = 'src/config/api-config.ts'
        if os.path.exists(config_path):
            with open(config_path, 'r') as f:
                content = f.read()
            
            gemini_key = os.environ.get('AI_ASSISTANT_API_KEY') or os.environ.get('GEMINI_API_KEY') or os.environ.get('VITE_GEMINI_API_KEY')
            if gemini_key:
                content = content.replace('YOUR_GEMINI_API_KEY_HERE', gemini_key)
                print('Successfully baked Gemini API Key into api-config.ts!')
            
            youtube_key = os.environ.get('YOUTUBE_API_KEY')
            if youtube_key:
                content = content.replace('YOUR_YOUTUBE_API_KEY_HERE', youtube_key)
                print('Successfully baked YouTube API Key into api-config.ts!')
                
            with open(config_path, 'w') as f:
                f.write(content)
        "

    - name: Build Web Application
      run: npm run build

    - name: Install Capacitor CLI & Platforms
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        gradle assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-voice-assistant-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
