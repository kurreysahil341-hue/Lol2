name: Build Hey Sheri APK
On:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.7"

    - name: Verify & Auto-Repair Project Files
      run: |
        if [ ! -d "app" ]; then
          FOUND_APP=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
          if [ -n "$FOUND_APP" ]; then
            cp -r "$(dirname "$FOUND_APP")"/* .
          fi
        fi

        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          cat << 'EOF' > settings.gradle.kts
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://alphacephei.com/maven/") }
    }
}
rootProject.name = "HeySheri"
include(":app")
EOF
        fi

        if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
          cat << 'EOF' > build.gradle.kts
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.4.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
    }
}
plugins {
    id("com.android.application") version "8.4.1" apply false
    id("org.jetbrains.kotlin.android") version "1.9.24" apply false
}
tasks.register("clean", Delete::class) {
    delete(rootProject.layout.buildDirectory)
}
EOF
        fi

        if [ ! -f "gradle.properties" ]; then
          cat << 'EOF' > gradle.properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
EOF
        fi

    - name: Build Android Debug APK
      run: gradle clean assembleDebug --no-daemon --stacktrace

    - name: Upload Hey Sheri Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: HeySheri-Debug-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 14
