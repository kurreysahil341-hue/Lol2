name: Build, Package & GitHub Release

on:
  push:
    tags:
      - 'v*'
      - '*'
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Teacher Resume Builder App'

jobs:
  build-and-release:
    name: Build APK, Source ZIP & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android App (APK)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Release Assets (APK & Clean ZIP)
        run: |
          mkdir -p release-assets
          
          # Find and copy the generated APK
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-assets/Teacher-Resume-Builder.apk
          else
            echo "Error: No APK file generated!"
            exit 1
          fi
          
          # Package a clean source code ZIP for backup and deployment
          zip -r release-assets/Teacher-Resume-Builder-Source.zip . \
            -x "*.git*" \
            -x "*.gradle*" \
            -x "*app/build*" \
            -x "*build/*" \
            -x "*.idea*" \
            -x "*.build-outputs*" \
            -x "release-assets*" \
            -x "debug.keystore.base64" \
            -x "*.apk"

      - name: Calculate Release Tag and Metadata
        id: release_meta
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M')
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "tag_name=v1.0.0-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Build Artifacts (Downloadable in Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Resume-Builder-Assets
          path: release-assets/*
          if-no-files-found: error

      - name: Publish Official GitHub Release (On Tags or Manual Dispatch)
        if: steps.release_meta.outputs.is_tag == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Teacher Resume Builder (${{ steps.release_meta.outputs.tag_name }})
          body: |
            ## 📱 Teacher Resume Builder App
            
            स्वचालित रूप से निर्मित बिल्ड और सोर्स पैकेज।
            
            ### 📦 डाउनलोड करने के लिए उपलब्ध फाइलें (Release Assets):
            1. **`Teacher-Resume-Builder.apk`** — अपने मोबाइल में ऐप इंस्टॉल करने के लिए इस APK को डाउनलोड करें।
            2. **`Teacher-Resume-Builder-Source.zip`** — पूरे प्रोजेक्ट का साफ-सुथरा सोर्स कोड ZIP बैकअप।
            
            ---
            - **Build Date:** ${{ steps.release_meta.outputs.build_date }} UTC
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
          draft: false
          prerelease: false
          files: |
            release-assets/Teacher-Resume-Builder.apk
            release-assets/Teacher-Resume-Builder-Source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
